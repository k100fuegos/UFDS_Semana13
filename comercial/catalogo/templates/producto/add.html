{% extends "base.html" %}
{% load tailwind_filters %}
{% block titulo %} Agregar Producto {% endblock titulo %}

{% block contenido %}
<h1 class="text-2xl font-bold mb-4">Agregar Producto</h1>
<form method="post" action="{% url 'add_producto' %}" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="p-2 my-4 bg-blue-600 text-white hover:bg-blue-700 rounded cursor-pointer">Guardar</button>
</form>
{% endblock contenido %}
