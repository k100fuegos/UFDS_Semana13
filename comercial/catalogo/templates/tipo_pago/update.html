{% extends "base.html" %}
{% load tailwind_filters %}
{% block titulo %} Actualizar Tipo de Pago {% endblock titulo %}

{% block contenido %}
<h1 class="text-2xl font-bold mb-4">Actualizar Tipo de Pago</h1>
<form method="post" action="{% url 'update_tipo_pago' tipo_pago.id %}" class="max-w-xl">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="p-2 my-4 bg-blue-600 text-white hover:bg-blue-700 rounded cursor-pointer">Guardar</button>
</form>
{% endblock contenido %}
