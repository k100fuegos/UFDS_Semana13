{% extends "inicio.html" %}
{% load tailwind_filters %}
{% block titulo %} Login {% endblock titulo %}
{% block contenido %}
<form method="post" action="{% url 'login' %}" class="w-96 bg-white p-6 rounded-lg shadow">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="p-2 my-4 bg-blue-600 text-white hover:bg-blue-700 rounded w-full cursor-pointer">
        Ingresar
    </button>
</form>
{% endblock contenido %}
