{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block titulo %}Agregar categoría{% endblock titulo %}

{% block contenido %}
<h1>Agregar Categorías</h1>
<form method="post" action="{% url 'add_categoria' %}">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="p-2 my-4 bg-blue-600 text-white hover:bg-blue-700 rounded">Guardar</button>
</form>
{% endblock contenido %}
